# Basic CI workflow for exam practice

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run successful check
        run: echo "Starting CI pipeline"

      - name: Run test
        run: |
          echo "Running tests..."
          echo "Test 1: PASS"
          echo "Test 2: PASS"
          echo "Test 3: FAIL"
          exit 1

      - name: This step will not run
        run: echo "This step should not be executed"
